<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOLDEN HOUR Cover Studio — GTA 6-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>GOLDEN HOUR <span>Cover Studio</span></h1>
    <p class="tagline">Your photos into cinematic GTA-style cover art. Pick a layout, a grade, a caption — export a PNG to share.</p>

    <label class="field">Photos <input id="photo" type="file" accept="image/*" multiple></label>
    <div id="tray" class="tray" aria-label="Loaded photos"></div>
    <p class="hint">Click a photo to put it in the selected panel. Click a panel on the cover to select it.</p>

    <fieldset>
      <legend>Panel</legend>
      <p id="panel-name" class="panel-name">Panel: hero</p>
      <div id="panel-list" class="chips"></div>
      <label class="field">Fill <select id="panel-source"></select></label>
      <label class="field">Zoom <input id="panel-zoom" type="range" min="1" max="2.5" step="0.05" value="1"></label>
      <label class="field">Shift left–right <input id="panel-ox" type="range" min="-0.5" max="0.5" step="0.05" value="0"></label>
      <label class="field">Shift up–down <input id="panel-oy" type="range" min="-0.5" max="0.5" step="0.05" value="0"></label>
      <button id="fill-all" type="button">Fill every panel with this photo</button>
    </fieldset>

    <fieldset>
      <legend>Layout</legend>
      <div id="layout-pick" class="chips"></div>
    </fieldset>

    <fieldset>
      <legend>Colour grade</legend>
      <div id="grade-pick" class="chips"></div>
      <label class="check"><input id="poster-ink" type="checkbox"> Poster Ink halftone</label>
    </fieldset>

    <fieldset>
      <legend>Caption</legend>
      <label class="field">Kicker <input id="kicker" type="text" maxlength="40" value="WELCOME TO VICE CITY"></label>
      <label class="field">Title <input id="title" type="text" maxlength="24" value="GOLDEN HOUR"></label>
      <label class="field">Script subtitle <input id="subtitle" type="text" maxlength="40" value="Neon Dusk"></label>
      <label class="field">Tagline <input id="tagline" type="text" maxlength="40" value="ONE COAST · NO RULES · COMING SOON"></label>
      <label class="field">Wanted stars
        <select id="stars">
          <option value="5" selected>★★★★★ (5)</option>
          <option value="4">★★★★ (4)</option>
          <option value="3">★★★ (3)</option>
          <option value="0">None</option>
        </select>
      </label>
      <label class="check"><input id="badge" type="checkbox" checked> Seal badge</label>
    </fieldset>

    <fieldset>
      <legend>Export PNG</legend>
      <div id="size-pick" class="chips"></div>
      <div class="exports">
        <button id="export-1920x1080" type="button">Export 1920 × 1080</button>
        <button id="export-1080x1080" type="button">Export 1080 × 1080</button>
        <button id="export-1080x1350" type="button">Export 1080 × 1350</button>
      </div>
      <p id="status" role="status"></p>
    </fieldset>
  </section>
  <section class="preview" aria-label="Live preview">
    <canvas id="cover" width="960" height="540" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
